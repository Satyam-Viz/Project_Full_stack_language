<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile-Card</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/44c9de1ce6.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="main">
        <div class="image">
        <div class="imagebox"><img src="own_image.jpg" alt="Photo" ></div>
        </div>
        <div class="desc">
            <h2>Satyam Vishwakarma</h2>
            <p>Web Developer & Graphic Designer</p>
            <div class="icon">
                <a href="#"><i class="fa-brands fa-facebook" id="facebook"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter" id="twitter"></i></a>
                <a href="#"><i class="fa-brands fa-square-instagram" id="insta"></i></a>
                <a href="#"><i class="fa-brands fa-square-whatsapp" id="whatsapp"></i></a>
            </div>
            <div class="button">
                <button id="main">Subscribe</button>
                <button id="main">Message</button>
            </div>
            <div class="icon2">
                <a><i class="fa-solid fa-heart">60k</i></a>
                <a><i class="fa-solid fa-message">20k</i></a>
                <a><i class="fa-solid fa-share" id="share">12k</i></a>
            </div>
        </div>
    </div>
</body>
</html>
